spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:transfers;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update   # demo only; use Flyway/Liquibase migrations in production
management:
  endpoint:
    health:
      probes:
        enabled: true    # /actuator/health/liveness and /readiness for Kubernetes
  endpoints:
    web:
      exposure:
        include: health,info
